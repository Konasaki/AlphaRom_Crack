name: Build AlphaROM Crack DLL

on:
  workflow_dispatch: # 允許手動點擊按鈕觸發編譯

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution (x86 Release)
      run: msbuild AlphaROM_Crack.sln /p:Configuration=Release /p:Platform=x86

    - name: Build Solution (x64 Release)
      run: msbuild AlphaROM_Crack.sln /p:Configuration=Release /p:Platform=x64
      continue-on-error: true # 如果專案本身不支援 64 位元，跳過不報錯

    - name: Upload compiled DLLs
      uses: actions/upload-artifact@v4
      with:
        name: version-dll-packages
        path: |
          **/Release/*.dll
          **/x64/Release/*.dll

